# Render.com Deployment Configuration
# This file deploys both frontend and backend to Render.com (FREE tier)

services:
  # Backend API Service
  - type: web
    name: zbook-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        value: mongodb://localhost:27017/zbookstore
      - key: JWT_SECRET
        value: zbk_secure_jwt_key_production_2024
      - key: JWT_EXPIRE
        value: 7d
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://zbook-frontend.onrender.com
    healthCheckPath: /api/health
    plan: starter

  # Frontend Static Site
  - type: web
    name: zbook-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://zbook-backend.onrender.com/api
    plan: starter

# Note: For MongoDB, you can use:
# 1. MongoDB Atlas (FREE tier): https://www.mongodb.com/atlas
# 2. Or deploy MongoDB as a private service on Render
